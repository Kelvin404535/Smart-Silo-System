services:
  - type: web
    name: smart-silo-system
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn "run:app" --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --graceful-timeout 120 --keep-alive 5
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: RENDER
        value: true
      - key: DB_PATH
        value: /data/silo_management.db
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_SERVER
        sync: false          # smtp-relay.brevo.com
      - key: MAIL_PORT
        sync: false          # 587
      - key: MAIL_USE_TLS
        sync: false          # True
      - key: MAIL_USE_SSL
        sync: false          # False
      - key: MAIL_USERNAME
        sync: false          # Brevo SMTP login (e.g. xxxx@smtp-brevo.com)
      - key: MAIL_PASSWORD
        sync: false          # Brevo SMTP key
      - key: MAIL_DEFAULT_SENDER
        sync: false          # verified sender address in Brevo
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
