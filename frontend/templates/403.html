<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Smart Silo System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 0;
        }
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .icon { font-size: 72px; margin-bottom: 20px; }
        h1 { color: white; font-size: 28px; margin-bottom: 10px; }
        p  { color: rgba(255,255,255,0.75); font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
        .role-badge {
            display: inline-block;
            background: rgba(239,68,68,0.25);
            border: 1px solid rgba(239,68,68,0.5);
            color: #fca5a5;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin: 12px 0 24px;
        }
        .btn-home {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s;
        }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16,185,129,0.4); }
        @media (max-width: 480px) { .card { padding: 36px 24px; } h1 { font-size: 22px; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔒</div>
        <h1>Access Denied</h1>
        <p>You don't have permission to view this page.</p>
        {% if role is defined %}
        <div class="role-badge">Your role: {{ role.replace('_', ' ').title() }}</div>
        {% endif %}
        <p>Contact your administrator if you think this is a mistake.</p>
        <br>
        <a href="{{ url_for('dashboard.dashboard') }}" class="btn-home">← Back to Dashboard</a>
    </div>
</body>
</html>
